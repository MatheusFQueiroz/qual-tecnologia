<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qual tecnologia resolve?</title>
<meta name="description" content="Jogo para crianças: descubra qual tecnologia resolve cada problema do dia a dia, em casa, na escola, na rua e no cuidado com a saúde.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
:root{
  --tinta:#2A3081; --tinta-suave:#5A5F9E; --fundo:#F4F5FB; --papel:#FFFFFF; --borda:#D6D9EC;
  --ok:#2F9E44; --ok-suave:#E6F6EA; --calma:#3B6FD8; --calma-suave:#E8EFFD; --sol:#FFD43B;
  --sombra:0 4px 0 rgba(42,48,129,.12);
  --raio:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"Trebuchet MS","Nunito",Verdana,sans-serif;color:var(--tinta);background:var(--fundo);
  display:flex;flex-direction:column;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--calma);outline-offset:3px}
.oculto{display:none!important}

/* ---------- topo ---------- */
header{background:var(--tinta);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-size:clamp(17px,3.8vw,26px);letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btTopo{background:rgba(255,255,255,.14);border:none;border-radius:14px;color:#fff;font-size:22px;
  min-width:48px;height:48px;padding:0 12px;display:flex;align-items:center;gap:6px;font-weight:bold}
.btTopo:hover{background:rgba(255,255,255,.25)}
.btTopo span{font-size:16px}

main{flex:1;display:flex;flex-direction:column}
.tela{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px}

/* ---------- mascote ---------- */
.boasVindas{display:flex;align-items:center;gap:14px;max-width:760px;width:100%;margin-bottom:18px}
.robo{font-size:64px;line-height:1;flex-shrink:0}
.balao{background:var(--papel);border:3px solid var(--borda);border-radius:var(--raio);padding:14px 18px;
  font-size:clamp(17px,3.2vw,21px);position:relative;flex:1;box-shadow:var(--sombra)}
.balao::before{content:"";position:absolute;left:-14px;top:22px;border:8px solid transparent;border-right-color:var(--borda);border-width:8px 12px}

/* ---------- mapa ---------- */
.mundos{display:flex;flex-direction:column;gap:18px;max-width:760px;width:100%}
.mundo{border-radius:26px;padding:16px 18px 20px;border:3px solid rgba(0,0,0,.06);box-shadow:var(--sombra)}
.mundo h2{font-size:clamp(19px,3.6vw,24px);display:flex;align-items:center;gap:10px}
.mundo h2 .ic{font-size:34px}
.mundo p{font-size:16px;color:var(--tinta-suave);margin:4px 0 14px 44px}
.trilha{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.fase{width:64px;height:64px;border-radius:50%;border:4px solid var(--tinta);background:var(--papel);
  font-size:24px;font-weight:bold;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fase:hover{transform:scale(1.07)}
.fase.feita{border-color:var(--ok);font-size:30px}
.fase.proxima{background:var(--sol);box-shadow:0 0 0 6px rgba(255,212,59,.35)}
.fase.trancada{border-style:dashed;border-color:#B7BBD6;color:#B7BBD6;cursor:not-allowed}
.fase.trancada:hover{transform:none}
.liga{width:14px;height:4px;background:rgba(42,48,129,.18);border-radius:2px}

/* ---------- jogo ---------- */
#jogo{gap:clamp(12px,2.6vh,22px)}
.topoJogo{display:flex;align-items:center;gap:12px;max-width:900px;width:100%}
.topoJogo .robo{font-size:52px}
.topoJogo .balao{font-size:clamp(18px,3.4vw,23px);font-weight:bold}
.btSec{background:var(--papel);border:3px solid var(--borda);border-radius:16px;padding:10px 18px;font-size:18px;font-weight:bold;
  display:flex;align-items:center;gap:8px;min-height:52px}
.btSec:hover{border-color:var(--tinta)}
.passos{display:flex;gap:6px;justify-content:center}
.passos i{width:14px;height:14px;border-radius:50%;background:#D6D9EC;display:block}
.passos i.f{background:var(--ok)}
.passos i.a{background:var(--sol);outline:3px solid var(--tinta)}
.cena{background:var(--papel);border:3px solid var(--borda);border-radius:28px;padding:18px 24px;max-width:820px;width:100%;
  display:flex;align-items:center;gap:20px}
.cena .fig{width:clamp(80px,16vw,120px);height:clamp(80px,16vw,120px);flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(56px,11vw,84px);line-height:1;background:#FFF6D1;border-radius:24px}
.cena .fig img{width:80%;height:80%}
.cena .txt{font-size:clamp(21px,4vw,30px);font-weight:bold;line-height:1.3}
.cena .txt small{display:block;font-size:clamp(15px,2.6vw,18px);color:var(--tinta-suave);font-weight:normal;margin-top:6px}
.contador{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:bold;color:var(--tinta-suave)}
.contador:empty{display:none}
.contador b{width:30px;height:30px;border-radius:50%;border:3px dashed var(--borda);display:inline-flex;align-items:center;justify-content:center;font-size:16px;background:var(--papel)}
.contador b.ok{border:3px solid var(--ok);background:var(--ok-suave);color:var(--ok)}
#opcoes{display:flex;gap:clamp(10px,2.4vw,18px);flex-wrap:wrap;justify-content:center;max-width:900px}
.op{width:clamp(140px,27vw,200px);min-height:clamp(140px,24vw,180px);border-radius:24px;background:var(--papel);border:5px solid var(--tinta);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;
  box-shadow:0 6px 0 var(--tinta);transition:transform .12s,box-shadow .12s,background .15s,opacity .2s}
.op .e{font-size:clamp(46px,8.6vw,62px);line-height:1;height:clamp(56px,10vw,76px);display:flex;align-items:center}
.op .e img{height:100%;width:auto}
.op .t{font-size:clamp(15px,2.6vw,18px);font-weight:bold;text-align:center;line-height:1.2}
.op:hover{background:#FFF9D6}
.op:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tinta)}
.op.certa{border-color:var(--ok);background:var(--ok-suave);box-shadow:0 6px 0 var(--ok);cursor:default}
.op.fora{opacity:.4;border-color:#B7BBD6;box-shadow:0 6px 0 #B7BBD6;cursor:default}
.op.fora:hover{background:var(--papel)}
.acoesJogo{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#aviso{min-height:56px;display:flex;align-items:center;justify-content:center}
#aviso div{background:var(--calma-suave);color:var(--tinta);border:3px solid #BFD0F7;font-size:clamp(17px,3vw,21px);font-weight:bold;
  padding:10px 22px;border-radius:16px;text-align:center;max-width:760px}

/* ---------- conclusão ---------- */
.veu{position:fixed;inset:0;background:rgba(244,245,251,.94);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}
.cartao{background:var(--papel);border-radius:30px;border:4px solid var(--borda);padding:26px 24px;max-width:520px;width:100%;margin:auto;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 10px 0 rgba(42,48,129,.1)}
.cartao .tit{font-size:clamp(28px,6vw,38px);font-weight:bold}
.cartao .exp{font-size:clamp(18px,3.4vw,22px);line-height:1.4;background:var(--ok-suave);border-radius:18px;padding:12px 16px}
.cartao .sub{font-size:18px;color:var(--tinta-suave)}
.figurinha{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#FFF6D1 0 60%,#FFE8A3 100%);
  border:6px solid var(--sol);font-size:66px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btPrin{background:var(--ok);color:#fff;border:none;border-radius:18px;padding:16px 30px;font-size:24px;font-weight:bold;
  box-shadow:0 6px 0 #237A34;min-height:64px}
.btPrin:active{transform:translateY(4px);box-shadow:0 2px 0 #237A34}
.linhaBts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pense{background:#FFF6D1;border:3px solid #F0C419;border-radius:18px;padding:12px 16px;font-size:19px;line-height:1.4}

/* ---------- álbum e ajustes ---------- */
.tituloTela{font-size:clamp(22px,4.4vw,30px);margin-bottom:6px;text-align:center}
.textoTela{font-size:18px;color:var(--tinta-suave);margin-bottom:18px;text-align:center;max-width:620px}
.grupoAlbum{max-width:760px;width:100%;margin-bottom:18px}
.grupoAlbum h3{font-size:20px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.slot{aspect-ratio:1;border-radius:50%;background:var(--papel);border:4px dashed var(--borda);display:flex;align-items:center;justify-content:center;
  font-size:46px;color:#C9CCE2}
.slot.tem{border:4px solid var(--sol);background:radial-gradient(circle,#FFF6D1 0 60%,#FFE8A3 100%)}
.ajustes{max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
.ajuste{background:var(--papel);border:3px solid var(--borda);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:14px;font-size:18px;text-align:left}
.ajuste .txt{flex:1}
.ajuste small{display:block;color:var(--tinta-suave);font-size:15px;margin-top:2px}
.chave{width:64px;height:36px;border-radius:18px;background:#C9CCE2;position:relative;flex-shrink:0;transition:background .2s}
.chave::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.ajuste[aria-checked="true"] .chave{background:var(--ok)}
.ajuste[aria-checked="true"] .chave::after{left:32px}
.perigo{color:#8A3B12}

/* ---------- animações (desligáveis) ---------- */
@keyframes balanca{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes surge{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.balanca{animation:balanca .35s ease-in-out 2}
.surge{animation:surge .45s ease-out}
body.semAnim *,body.semAnim *::before,body.semAnim *::after{animation:none!important;transition:none!important}

@media (max-width:520px){
  .robo{font-size:48px}
  .topoJogo .robo{font-size:40px}
  .balao::before{display:none}
  .mundo p{margin-left:0}
  .fase{width:56px;height:56px;font-size:21px}
  .liga{width:8px}
  .btTopo span{display:none}
  .cena{padding:14px;gap:14px}
}
</style></head><body>

  <button class="btTopo" id="btMapa" aria-label="Voltar ao mapa">🗺️<span>Mapa</span></button>

</main>

  {r:'lav',ok:[0],op:[['👕','Limpar a roupa suja'],['🍲','Esquentar a comida'],['🌑','Iluminar o escuro']],x:'A máquina de lavar limpa a roupa.',f:'🧼'},
  {r:'termo',ok:[0],op:[['🤒','Ver se tem febre'],['🗺️','Mostrar o caminho'],['📸','Tirar foto']],x:'O termômetro mede se a gente está com febre.',f:'🌡️'},
  {r:'vent',ok:[0],op:[['🥵','Refrescar no calor'],['🥛','Guardar o leite'],['😴','Acordar cedo']],x:'O ventilador refresca quando está calor.',f:'🍃'},
  {r:'semaf',ok:[0],op:[['🚶','Ajudar a atravessar a rua'],['🍓','Fazer suco'],['🦷','Limpar os dentes']],x:'O semáforo organiza a rua para a gente atravessar com segurança.',f:'🚥'},
  {r:'cel',ok:[0,1,2],op:[['👵','Ver a vovó que mora longe'],['📸','Tirar foto'],['🗺️','Mostrar o caminho'],['👕','Lavar a roupa']],x:'O celular faz muitas coisas: chamada de vídeo, foto, mapa… Só não lava roupa!',f:'📱'}]}
];
var FASES=[]; MUNDOS.forEach(function(m,mi){ m.fases.forEach(function(f,fi){ f.m=mi; f.i=fi; FASES.push(f); }); });
var NUM=['','uma','duas','três','quatro'];
var ELOGIOS=['Muito bem!','Você conseguiu!','Isso mesmo!','Boa ideia!','Mandou bem!'];

/* ---------- memória (neste aparelho) ---------- */
var CHAVE='qual-tecnologia-v2';
var est={feitas:{},som:false,anim:true,livre:false};
try{ var sv=JSON.parse(localStorage.getItem(CHAVE)||'null'); if(sv) for(var k in sv) est[k]=sv[k]; }catch(e){}
try{ if(!localStorage.getItem(CHAVE) && window.matchMedia('(prefers-reduced-motion: reduce)').matches) est.anim=false; }catch(e){}
function salva(){ try{ localStorage.setItem(CHAVE,JSON.stringify(est)); }catch(e){} }

var $=function(i){return document.getElementById(i)};
function el(tag,cls,txt){ var d=document.createElement(tag); if(cls) d.className=cls; if(txt!=null) d.textContent=txt; return d; }
function icone(ic,alt){
  if(ic.indexOf('img:')===0){ var im=el('img'); im.src='img/'+ic.slice(4)+'.svg'; im.alt=alt||''; return im; }
  return document.createTextNode(ic);
}
function aplicaAnim(){ document.body.classList.toggle('semAnim',!est.anim); }
aplicaAnim();

/* ---------- som suave (desligado por padrão) ---------- */
var ctx=null;
function tom(freqs){
  if(!est.som) return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.12;
      o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(.08,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.35);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.4);
    });
  }catch(e){}
}
function fala(txt){
  try{ speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(txt.replace(/[^\p{L}\p{N}\s.,!?º]/gu,'')); u.lang='pt-BR'; u.rate=.9; speechSynthesis.speak(u); }catch(e){}
}

/* ---------- navegação ---------- */
function mostra(id){
  ['mapa','jogo','album','ajustes'].forEach(function(t){ $(t).classList.toggle('oculto',t!==id); });
  $('premio').classList.add('oculto');
  try{ speechSynthesis.cancel(); }catch(e){}
  window.scrollTo(0,0);
}
function aberta(i){ return est.livre || i===0 || !!est.feitas[i-1] || !!est.feitas[i]; }
function proxima(){ for(var i=0;i<FASES.length;i++) if(!est.feitas[i]) return i; return -1; }

function mapa(){
  var t=$('mapa'); t.innerHTML='';
  var p=proxima(), nFeitas=Object.keys(est.feitas).length;
  var bv=el('div','boasVindas'); bv.appendChild(el('div','robo','🤖'));
  var msg = nFeitas===0 ? 'Oi! Eu sou o Tito. Vamos descobrir como as tecnologias ajudam a gente? Toque na bolinha amarela para começar.'
          : p<0 ? 'Você visitou todos os lugares! Pode jogar qualquer fase de novo quando quiser.'
          : 'Que bom te ver! A bolinha amarela mostra onde paramos.';
  bv.appendChild(el('div','balao',msg)); t.appendChild(bv);
  var ms=el('div','mundos');
  MUNDOS.forEach(function(m){
    var c=el('div','mundo'); c.style.background=m.cor;
    var h=el('h2'); h.appendChild(el('span','ic',m.ic)); h.appendChild(el('span',null,m.nome)); c.appendChild(h);
    c.appendChild(el('p',null,m.txt));
    var tr=el('div','trilha');
    m.fases.forEach(function(f,fi){
      var gi=FASES.indexOf(f);
      if(fi>0) tr.appendChild(el('span','liga'));
      var b=el('button','fase');
      if(est.feitas[gi]){ b.classList.add('feita'); b.textContent=f.f; b.setAttribute('aria-label','Fase '+(fi+1)+', já visitada'); }
      else if(aberta(gi)){ b.textContent=fi+1; if(gi===p) b.classList.add('proxima'); b.setAttribute('aria-label','Fase '+(fi+1)); }
      else { b.classList.add('trancada'); b.textContent='🔒'; b.setAttribute('aria-label','Fase '+(fi+1)+', ainda fechada'); }
      b.onclick=function(){ if(aberta(gi)) joga(gi); };
      tr.appendChild(b);
    });
    c.appendChild(tr); ms.appendChild(c);
  });
  t.appendChild(ms);
  mostra('mapa');
}

/* ---------- jogo ---------- */
var atual=0, L=null, achadas=0, erros=0, botoes=[];

function joga(i){
  atual=i; L=FASES[i]; achadas=0; erros=0; botoes=[]; $('aviso').innerHTML='';
  var m=MUNDOS[L.m];
  var ps=$('passos'); ps.innerHTML='';
  m.fases.forEach(function(f,fi){ var d=el('i'); if(est.feitas[FASES.indexOf(f)]) d.className='f'; if(fi===L.i) d.className='a'; ps.appendChild(d); });

  var multi=L.ok.length>1, fig=$('cenaFig'), txt=$('cenaTxt');
  fig.innerHTML=''; txt.innerHTML='';
  if(L.r){
    fig.appendChild(icone(T[L.r][0],T[L.r][1]));
    txt.textContent=T[L.r][1];
    txt.appendChild(el('small',null,multi?'Ela resolve vários problemas!':'Que problema ela resolve?'));
    $('pergunta').textContent = multi ? 'Para que serve? Encontre as '+NUM[L.ok.length]+' respostas certas.' : 'Para que serve?';
  } else {
    fig.appendChild(icone(L.e));
    txt.textContent=L.p;
    $('pergunta').textContent = multi ? 'Aqui '+NUM[L.ok.length]+' tecnologias resolvem. Encontre as '+NUM[L.ok.length]+'!' : 'Qual tecnologia resolve?';
  }
  contador();

  var o=$('opcoes'); o.innerHTML='';
  var ordem=L.op.map(function(_,j){return j;}).sort(function(){return Math.random()-.5});
  ordem.forEach(function(j){
    var item=L.op[j], certo, ic, nome;
    if(L.r){ ic=item[0]; nome=item[1]; certo=L.ok.indexOf(j)>=0; }
    else { ic=T[item][0]; nome=T[item][1]; certo=L.ok.indexOf(item)>=0; }
    var b=el('button','op'); var e=el('div','e'); e.appendChild(icone(ic,'')); b.appendChild(e); b.appendChild(el('div','t',nome));
    b.setAttribute('aria-label',nome); b._certo=certo;
    b.onclick=function(){ escolhe(b); };
    o.appendChild(b); botoes.push(b);
  });
  mostra('jogo');
}
function contador(){
  var c=$('contador'); c.innerHTML='';
  if(L.ok.length<2) return;
  c.appendChild(el('span',null,'Encontradas:'));
  for(var i=0;i<L.ok.length;i++) c.appendChild(el('b',i<achadas?'ok':'',i<achadas?'✓':''));
}
function avisa(txt){ var a=$('aviso'); a.innerHTML=''; a.appendChild(el('div',est.anim?'surge':'',txt)); }
function escolhe(b){
  if(b.classList.contains('certa')||b.classList.contains('fora')) return;
  if(b._certo){
    b.classList.add('certa'); achadas++; tom([523]); contador();
    if(achadas>=L.ok.length) setTimeout(conclui,est.anim?450:0);
    else avisa('Isso! Tem mais '+NUM[L.ok.length-achadas]+' que também resolve.');
  } else {
    erros++; tom([330]); b.classList.add('fora');
    if(est.anim) b.classList.add('balanca');
    var frases=L.r ? ['Essa não é o que ela faz. Tente outra!','Pense: para que a gente usa essa tecnologia?']
                   : ['Essa não resolve este problema. Tudo bem, tente outra!','Pense: o que precisa acontecer para resolver?'];
    avisa(frases[Math.min(erros-1,frases.length-1)]);
  }
}
function dica(){
  var errados=botoes.filter(function(b){ return !b._certo && !b.classList.contains('fora'); });
  if(!errados.length){ avisa('💡 Todas as que sobraram resolvem! Toque nelas.'); return; }
  errados[0].classList.add('fora');
  avisa('💡 Tirei uma que não resolve. Sobrou menos para escolher!');
}

function vezesCelular(){ var n=0; FASES.forEach(function(f){ if(f.r==='cel') n+=f.ok.length; else if(!f.r && f.ok.indexOf('cel')>=0) n++; }); return n; }
function conclui(){
  var novo=!est.feitas[atual]; est.feitas[atual]=1; salva();
  tom([523,659,784]);
  var ult=atual===FASES.length-1, fimMundo=L.i===MUNDOS[L.m].fases.length-1;
  var p=$('premio'); p.innerHTML='';
  var c=el('div','cartao');
  c.appendChild(el('div','tit',ELOGIOS[Math.floor(Math.random()*ELOGIOS.length)]));
  c.appendChild(el('div','exp',L.x));
  var fg=el('div','figurinha'+(est.anim?' surge':''),L.f); fg.setAttribute('aria-hidden','true'); c.appendChild(fg);
  c.appendChild(el('div','sub', novo ? 'Uma figurinha nova para o seu álbum!' : 'Essa figurinha já está no seu álbum.'));
  if(fimMundo && !ult) c.appendChild(el('div','sub','Você explorou todo o lugar "'+MUNDOS[L.m].nome+'" '+MUNDOS[L.m].ic));
  if(ult) c.appendChild(el('div','pense','📱 Você reparou? O celular apareceu como resposta '+vezesCelular()+' vezes! Por que será que ele resolve tanta coisa?'));
  var lb=el('div','linhaBts');
  if(!ult){ var bp=el('button','btPrin','Continuar →'); bp.onclick=function(){ joga(atual+1); }; lb.appendChild(bp); }
  else { var ba=el('button','btPrin','Ver meu álbum 📒'); ba.onclick=album; lb.appendChild(ba); }
  var bo=el('button','btSec','🔊 Ouvir'); bo.onclick=function(){ fala(L.x); }; lb.appendChild(bo);
  var bm=el('button','btSec','🗺️ Mapa'); bm.onclick=mapa; lb.appendChild(bm);
  c.appendChild(lb); p.appendChild(c); p.classList.remove('oculto');
  setTimeout(function(){ var b=p.querySelector('.btPrin'); if(b) b.focus(); },50);
}

/* ---------- álbum ---------- */
function album(){
  var t=$('album'); t.innerHTML='';
  t.appendChild(el('h2','tituloTela','📒 Meu álbum'));
  t.appendChild(el('p','textoTela','Cada fase guarda uma figurinha. Não tem pressa: cada um completa o seu álbum no seu tempo.'));
  MUNDOS.forEach(function(m){
    var g=el('div','grupoAlbum'); var h=el('h3'); h.appendChild(el('span',null,m.ic)); h.appendChild(el('span',null,m.nome)); g.appendChild(h);
    var gr=el('div','album');
    m.fases.forEach(function(f){ var gi=FASES.indexOf(f); gr.appendChild(el('div','slot'+(est.feitas[gi]?' tem':''), est.feitas[gi]?f.f:'?')); });
    g.appendChild(gr); t.appendChild(g);
  });
  if(proxima()<0){ var pz=el('div','pense','📱 Você reparou? O celular apareceu como resposta '+vezesCelular()+' vezes! Por que será que ele resolve tanta coisa?'); pz.style.maxWidth='760px'; t.appendChild(pz); }
  mostra('album');
}

/* ---------- ajustes ---------- */
function ajustes(){
  var t=$('ajustes'); t.innerHTML='';
  t.appendChild(el('h2','tituloTela','⚙️ Ajustes'));
  t.appendChild(el('p','textoTela','Os ajustes ficam guardados neste aparelho.'));
  var box=el('div','ajustes');
  function chave(nome,desc,prop,depois){
    var b=el('button','ajuste'); b.setAttribute('role','switch'); b.setAttribute('aria-checked',est[prop]?'true':'false');
    var tx=el('div','txt',nome); tx.appendChild(el('small',null,desc)); b.appendChild(tx); b.appendChild(el('div','chave'));
    b.onclick=function(){ est[prop]=!est[prop]; salva(); b.setAttribute('aria-checked',est[prop]?'true':'false'); if(depois) depois(); };
    box.appendChild(b);
  }
  chave('🔔 Sons','Sons baixinhos ao tocar nas respostas.','som');
  chave('✨ Animações','Movimentos suaves na tela. Desligue se incomodar.','anim',aplicaAnim);
  chave('🔓 Todas as fases abertas','Para o professor escolher qualquer fase.','livre');
  var r=el('button','ajuste'); var rt=el('div','txt perigo','🧹 Recomeçar do zero'); rt.appendChild(el('small',null,'Apaga as figurinhas deste aparelho.'));
  r.appendChild(rt);
  r.onclick=function(){ if(confirm('Apagar todas as figurinhas deste aparelho?')){ est.feitas={}; salva(); mapa(); } };
  box.appendChild(r);
  t.appendChild(box);
  mostra('ajustes');
}

$('btMapa').onclick=mapa;
$('btAlbum').onclick=album;
$('btAjustes').onclick=ajustes;
$('btDica').onclick=dica;
$('btOuvir').onclick=function(){ fala($('pergunta').textContent+' '+$('cenaTxt').textContent); };
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape' && !$('premio').classList.contains('oculto')) mapa(); });
mapa();
})();
</script></body></html>
