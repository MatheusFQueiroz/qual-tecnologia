<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qual tecnologia resolve?</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Trebuchet MS",Verdana,sans-serif;color:#2A3081;background:#F4F5FB;display:flex;flex-direction:column}
header{background:#2A3081;color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0}
header h1{font-size:23px}
.chip{font-size:19px;font-weight:bold;border-radius:12px;padding:8px 16px}
#nivelC{background:#fff;color:#2A3081;margin-left:auto}
#pontosC{background:#FFD900;color:#2A3081}
#palco{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;position:relative}
#emoji{font-size:110px;line-height:1}
#problema{font-size:32px;font-weight:bold;text-align:center;max-width:820px}
#dica{font-size:20px;color:#666}
#opcoes{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.op{width:200px;min-height:150px;border-radius:20px;background:#fff;border:6px solid #2A3081;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;transition:transform .15s}
.op:hover{transform:scale(1.06);background:#FFF9D6}
.op .e{font-size:64px;line-height:1}
.op .t{font-size:18px;font-weight:bold;text-align:center}
.op.certa{border-color:#2F9E44;background:#E5F5E8}
.op.errada{border-color:#E03131;opacity:.45}
#aviso{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:24px;font-weight:bold;padding:12px 26px;border-radius:14px;display:none;background:#E8590C;color:#fff}
#festa{position:absolute;inset:0;background:rgba(255,255,255,.97);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#festa .tit{font-size:50px;font-weight:bold}
#festa .sub{font-size:25px;color:#444;max-width:760px;line-height:1.4}
#festa button{font:inherit;font-size:25px;font-weight:bold;padding:15px 32px;border:none;border-radius:14px;background:#2F9E44;color:#fff;cursor:pointer}
</style></head><body>
<header><h1>QUAL TECNOLOGIA RESOLVE?</h1><div class="chip" id="nivelC">—</div><div class="chip" id="pontosC">⭐ 0</div></header>
<div id="palco">
 <div id="emoji">—</div><div id="problema">—</div><div id="dica"></div>
 <div id="opcoes"></div><div id="aviso"></div><div id="festa"></div>
</div>
<script>
(function(){
var T={cel:['📱','CELULAR'],mic:['♨️','MICRO-ONDAS'],gel:['🧊','GELADEIRA'],lam:['💡','LÂMPADA'],
 lan:['🔦','LANTERNA'],tv:['📺','TELEVISÃO'],som:['🔊','CAIXA DE SOM'],cart:['💳','MÁQUINA DE CARTÃO'],
 desp:['⏰','DESPERTADOR'],lav:['🌀','MÁQUINA DE LAVAR'],vent:['🌬️','VENTILADOR'],rel:['🕐','RELÓGIO']};
var P=[
 {e:'👵',p:'A vovó mora longe e eu quero ver ela.',ok:['cel'],op:['cel','gel','lam'],x:'Com o celular dá para fazer chamada de vídeo e ver a vovó!'},
 {e:'🍲',p:'A comida do almoço esfriou.',ok:['mic'],op:['tv','mic','rel'],x:'O micro-ondas esquenta a comida bem rápido.'},
 {e:'🌧️',p:'Quero saber se vai chover amanhã.',ok:['cel','tv'],op:['cel','lav','tv'],x:'Os dois servem! O celular e a televisão mostram a previsão do tempo.'},
 {e:'😴',p:'Preciso acordar cedo para a escola.',ok:['desp','cel'],op:['desp','gel','cel'],x:'Os dois servem! O despertador e o alarme do celular.'},
 {e:'🌑',p:'A sala ficou escura.',ok:['lam','lan'],op:['som','lam','lan'],x:'Os dois servem! A lâmpada e a lanterna iluminam.'},
 {e:'🥛',p:'O leite não pode estragar.',ok:['gel'],op:['gel','mic','vent'],x:'A geladeira deixa a comida gelada e ela demora a estragar.'},
 {e:'🎵',p:'Quero ouvir a minha música preferida.',ok:['cel','som'],op:['cel','lam','som'],x:'Os dois servem! O celular e a caixa de som tocam música.'},
 {e:'👕',p:'A minha roupa está toda suja.',ok:['lav'],op:['tv','lav','gel'],x:'A máquina de lavar limpa a roupa sozinha.'},
 {e:'🛒',p:'Preciso pagar a conta no mercado.',ok:['cart','cel'],op:['cart','vent','cel'],x:'Os dois servem! A máquina de cartão e o celular.'},
 {e:'🥵',p:'Está muito calor na sala.',ok:['vent'],op:['vent','mic','rel'],x:'O ventilador espalha o vento e refresca.'},
 {e:'🗺️',p:'Não sei o caminho para a casa do meu amigo.',ok:['cel'],op:['cel','tv','desp'],x:'O celular tem mapa e mostra o caminho!'},
 {e:'📺',p:'Quero assistir um desenho.',ok:['tv','cel'],op:['lav','tv','cel'],x:'Os dois servem! A televisão e o celular.'}
];
var idx=0,pontos=0,tent=0,usouCel=0;
var $=function(i){return document.getElementById(i)};
function aviso(t){var a=$('aviso');a.textContent=t;a.style.display='block';clearTimeout(a._t);a._t=setTimeout(function(){a.style.display='none'},1400);}
function monta(){
  var q=P[idx]; tent=0; $('festa').style.display='none';
  $('nivelC').textContent='Problema '+(idx+1)+' de '+P.length;
  $('emoji').textContent=q.e; $('problema').textContent=q.p;
  $('dica').textContent=q.ok.length>1?'Dica: aqui MAIS DE UMA resposta está certa!':'Clique na tecnologia que resolve.';
  var o=$('opcoes'); o.innerHTML='';
  q.op.forEach(function(k){
    var b=document.createElement('div'); b.className='op';
    b.innerHTML='<div class="e">'+T[k][0]+'</div><div class="t">'+T[k][1]+'</div>';
    b.onclick=function(){ escolhe(k,b); }; o.appendChild(b);
  });
}
function escolhe(k,b){
  var q=P[idx];
  if(q.ok.indexOf(k)>=0){
    b.className='op certa'; if(k==='cel') usouCel++;
    var g=tent===0?2:1; pontos+=g; $('pontosC').textContent='⭐ '+pontos;
    setTimeout(function(){ festa(q,g); },350);
  } else { tent++; b.className='op errada'; aviso('Essa não resolve. Tente outra!'); }
}
function festa(q,g){
  var ult=idx===P.length-1, f=$('festa');
  f.innerHTML='<div class="tit">'+(tent===0?'🎉 ISSO!':'👍 CONSEGUIU!')+'</div>'+
   '<div class="sub">'+q.x+'</div><button id="btS">'+(ult?'VER O RESULTADO':'PRÓXIMO →')+'</button>';
  f.style.display='flex';
  $('btS').onclick=function(){ if(ult) fim(); else { idx++; monta(); } };
}
function fim(){
  var nCel=P.filter(function(q){return q.ok.indexOf('cel')>=0}).length;
  $('festa').innerHTML='<div class="tit">🏆 VOCÊ TERMINOU!</div>'+
   '<div class="sub">Você juntou <b>'+pontos+'</b> estrelas.<br><br>'+
   '📱 Repare: o <b>CELULAR</b> resolvia <b>'+nCel+' problemas diferentes</b>!<br>'+
   'Por que será que ele resolve tanta coisa?</div>'+
   '<button id="btR">JOGAR DE NOVO</button>';
  $('btR').onclick=function(){ idx=0; pontos=0; usouCel=0; $('pontosC').textContent='⭐ 0'; monta(); };
}
monta();
})();
</script></body></html>
